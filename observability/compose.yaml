# Observability stack (issue #155, task 24) — a SEPARATE Compose project from
# the application stack (compose.yaml at the repo root). Run it from this
# directory. The backend exports OTLP to the Collector; the Collector enforces
# the A32 allowlist and fans out to Prometheus (metrics), Tempo (traces) and
# Loki (logs); Grafana shows the US-13 journey side by side. MailHog catches the
# owner notification email (used by task 37).
#
# Submission: local Compose only. Deploying this on AWS is future-development item X3.
# Grafana is behind authentication (GRAFANA_ADMIN_PASSWORD from the .env).
#
#   cd observability && docker compose up -d --wait

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (the backend exports here)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    # exemplar-storage keeps the trace-id exemplars scraped from the Collector (T-A4, #172).
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=exemplar-storage"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # The provisioned alert rule (grafana/provisioning/alerting/us14-overdue.yaml)
      # reads these. Grafana refuses to start if the email address is empty, so the
      # plain stack gets placeholders that go nowhere; `compose.alert.yaml` and
      # ci/test-compose.sh set the real values for the alert test, and exporting them
      # in your shell overrides these defaults.
      VT_ALERT_HUMAN_EMAIL: ${VT_ALERT_HUMAN_EMAIL:-oncall@example.invalid}
      VT_RESPONDER_WEBHOOK_URL: ${VT_RESPONDER_WEBHOOK_URL:-http://localhost:9/unused}
      VT_RESPONDER_WEBHOOK_TOKEN: ${VT_RESPONDER_WEBHOOK_TOKEN:-unused}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP (task 37's backend delivery sends here in dev/tests)
      - "8025:8025"   # web UI / HTTP API

volumes:
  tempo-data:
  loki-data:
