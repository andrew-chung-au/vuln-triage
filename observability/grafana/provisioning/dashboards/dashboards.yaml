# Grafana dashboard provider (issue #155, task 24): load the committed
# "US-13 journey" dashboard from the mounted folder.
apiVersion: 1

providers:
  - name: vulntriage
    orgId: 1
    folder: VulnTriage
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/dashboards
