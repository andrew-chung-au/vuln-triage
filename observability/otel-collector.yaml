# OpenTelemetry Collector config (issue #155, task 24).
#
# Receives OTLP from the backend, enforces the A32 allowlist as a SECOND line of
# defence (the backend already filters in code, task 23), and fans out to
# Prometheus (metrics), Tempo (traces) and Loki (logs).
#
# The allowlist drop is the no-leak guarantee: any attribute not on the A32 list
# — owner contact, advisory text, repository URLs, lockfile content, credentials,
# and the auto-instrumented url.*/db.statement attributes — is removed before
# export. (db.statement is emitted by the SQLAlchemy instrumentation added in
# task 23; it is NOT on the allowlist, so it is dropped here.)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

  # Keep ONLY the A32 allowlisted attribute keys on spans, metrics and logs;
  # drop everything else. The transform processor's `keep_keys` is the chosen
  # mechanism (VERIFY: contrib transform processor keep_keys semantics on the
  # pinned Collector version; the attributes processor with explicit deletes is
  # the fallback).
  transform/allowlist:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment", "vt.asset.id", "vt.finding.id", "vt.scan.id", "vt.scan.status", "vt.scan.trigger", "vt.tier", "vt.notification.kind", "vt.outcome", "vt.error.code", "http.route", "http.request.method", "http.response.status_code", "server.address"])
    log_statements:
      - context: log
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment", "vt.asset.id", "vt.finding.id", "vt.scan.id", "vt.scan.status", "vt.scan.trigger", "vt.tier", "vt.notification.kind", "vt.outcome", "vt.error.code", "http.route", "http.request.method", "http.response.status_code", "server.address"])
    metric_statements:
      # VERIFY (confirmed in the alert Compose CI job): the US-14 overdue gauge
      # (backend/vulntriage/observability/metrics.py `_observe_overdue`) emits
      # its datapoint attributes with PLAIN keys `finding_id` and `tier` (the
      # documented metric labels, _docs/architecture.md:
      # `vt_top_tier_notification_overdue{finding_id,tier}`), NOT the span key
      # `vt.tier`. So both plain keys must be on the datapoint keep_keys list
      # or the exported Prometheus series loses `tier` (A-TIER saw `{None}`
      # instead of `{'P1'}`). `vt.tier` stays on the trace/log keep_keys lists
      # above — it is the SPAN attribute key (mail/delivery.py, allowlist.py).
      - context: datapoint
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment", "vt.notification.kind", "vt.outcome", "vt.tier", "finding_id", "tier"])

exporters:
  # Prometheus scrapes this endpoint for metrics.
  # enable_open_metrics serves the OpenMetrics format, the only one that carries
  # exemplars (the trace id on vt_notifications_total, T-A4 / #172).
  # VERIFY: option name on contrib 0.111.0.
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
  # Traces to Tempo over OTLP.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Logs to Loki over OTLP (Loki's native OTLP ingest).
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/allowlist, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [transform/allowlist, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [transform/allowlist, batch]
      exporters: [otlphttp/loki]
