[project]
name = "vulntriage"
version = "0.1.0"
description = "VulnTriage backend (skeleton from task 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic>=1.16,<2",
    "httpx",
    "packaging",
    "argon2-cffi",
    "psycopg[binary]>=3.2,<4",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# --strict-markers: an unknown marker is an error, so every U-*/I-* case is
# tagged `unit` or `sqlite_integration` and the task-21 CI jobs can select by
# marker. Backend tests run without Docker, a live feed, a secret or a network.
addopts = "--strict-markers"
markers = [
    "unit: pure function or in-memory/SQLite case with no network",
    "sqlite_integration: case that exercises the SQLite integration harness",
]
