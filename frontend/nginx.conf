# Frontend nginx server (issue #137, task 15).
#
# Serves the built SPA and proxies the API to the backend on one origin (no
# CORS; the vt_session cookie is first-party). The API lives under /api, so the
# SPA cleanly owns `/`, `/findings`, `/assets` for client-side routing. The
# `/api/` location strips the prefix, so the backend still receives `/findings`,
# `/assets`, `/auth/...`, `/api/health` -> `/health`, etc. This matches the Vite
# dev-server proxy (#133) so dev and Compose behave the same.
#
# The unprivileged nginx image listens on 8080 as a non-root user.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The frontend container's own liveness probe (distinct from the backend's
    # /api/health). Compose health-checks this.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Everything under /api is the backend. The trailing slash on proxy_pass
    # strips the matched /api/ prefix, so the backend sees the bare path
    # (/api/findings -> /findings, /api/health -> /health).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-/api path serves index.html for client-side
    # routing (so a hard refresh on /findings or /assets loads the app).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
