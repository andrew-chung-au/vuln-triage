<svg viewBox="0 0 1200 627" width="1200" height="627" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="627" fill="#F4F1EA"/>
  <g transform="translate(100, 118)">
    <!-- Isometric Black Cube with Yellow P1 Top Face -->
