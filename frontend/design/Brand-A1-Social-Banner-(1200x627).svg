      <text x="150" y="98" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="64" fill="#111111" letter-spacing="-2">P1</text>
      <line x1="150" y1="152" x2="150" y2="314" stroke="#F4F1EA" stroke-width="6" stroke-linecap="round"/>
      <polygon points="150,152 280,82 280,238 150,312" fill="#222222"/>
