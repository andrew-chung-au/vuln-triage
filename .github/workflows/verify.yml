name: verify
on: [push, pull_request]
permissions:
  contents: read          # the job can read the repo, nothing more
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # VERIFY: astral-sh/setup-uv@v5 is the current major used here; confirm
      # before bumping and keep the version in step with the dev container.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
      - run: if grep -q '^install:' Makefile; then make install; fi
      - run: make verify
