name: deploy

# Build once on a push to main, tag with the course image tag, push to GHCR and
# record each digest (task 17 / #141). The automatic dev deploy on merge is
# task 21 (#142) and is added as a later job; this workflow builds and publishes
# the images and records their digests so a deploy can pull them by tag.
#
# Pull requests never get an AWS role or push images (that stays on verify.yml).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write        # push images to GHCR with the workflow GITHUB_TOKEN
  id-token: write        # assume the dev OIDC role for the deploy (task 21)

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # The course image tag: YYYYMMDD-HHMMSS-shortsha (roadmap D2), sortable
      # and traceable to the commit.
      - id: meta
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}

      - name: Build and push the frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}

      # Record each digest in the job summary — the deploy log the acceptance
      # ("the deploy log names one image digest") refers to.
      - name: Record the image digests
        run: |
          {
            echo "## Image digests for tag \`${{ steps.meta.outputs.tag }}\`"
            echo "- backend: \`${{ steps.backend.outputs.digest }}\`"
            echo "- frontend: \`${{ steps.frontend.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The automatic dev deploy runs here on a green build (task 21 / #142 fills in
  # the SSM deploy step; task 17 provides the build above that it consumes). It
  # is a separate job so the build can publish images even before task 21 lands.
  # deploy-dev:
  #   needs: build-and-push
  #   runs-on: ubuntu-latest
  #   environment: dev
  #   steps:
  #     - assume AWS_DEV_ROLE_ARN via OIDC
  #     - SSM SendCommand to the project=vuln-triage server: pull the tag, write
  #       the Caddyfile, docker compose up the dev project; skip-and-report when
  #       the instance is stopped (nightly stop). See task 21 (#142).
