# agent-kit.conf: per-project settings for the agent kit's scripts and git hooks.
# Lives in the project folder (next to AGENTS.md). Its presence is what opts the
# folder in: the repo's git hooks only act on folders that contain this file.
#
# Patterns are matched against paths relative to this folder. "*" matches any
# characters, including "/", so "*.db" matches "data/app.db" too.

# Where the kit lives, relative to this folder.
KIT_DIR="_docs/agent-kit"

# Commands the verification gate runs. TEST_CMD points at the target that runs
# all tests (currently the frontend's vitest suite in frontend/src/test/; the count is whatever vitest prints).
# TYPECHECK_CMD runs the frontend's tsc --noEmit (vitest and vite build do not
# type-check). LINT_CMD is empty because the project has no lint target.
TEST_CMD="make test"
LINT_CMD=""
TYPECHECK_CMD="make frontend-typecheck"

# Test files: deleting these, or adding skip/focus markers to them, fails the gate.
TEST_FILES=( 'tests/*' '*test_*.py' '*_test.py' '*conftest.py' '*.test.*' '*.spec.*' 'e2e/*' )

# Test files the human approved deleting. Exact paths relative to this folder,
# no globs (a glob entry fails the gate). Cite the human's decision above each entry.
APPROVED_TEST_DELETIONS=(
  # #15, human decision 2, 2026-10-18: frontend-bolt/ deleted in cbe2123
  'frontend-bolt/src/screens/screens.test.tsx'
  # #15, human decision 2, 2026-10-18: frontend-bolt/ deleted in cbe2123
  'frontend-bolt/src/services/affectedRanges.test.ts'
  # #15, human decision 2, 2026-10-18: frontend-bolt/ deleted in cbe2123
  'frontend-bolt/src/services/mockServices.test.ts'
  # #15, human decision 2, 2026-10-18: frontend-bolt/ deleted in cbe2123
  'frontend-bolt/src/services/riskAcceptance.test.ts'
)

# Never committed. Deleting an already-committed one is allowed.
FORBIDDEN=( '.env' '*/.env' '.env.*' '*/.env.*' '*.db' '*.sqlite' '*.sqlite3'
            '*__pycache__/*' '*.pyc' '*node_modules/*' '*.pem' '*.key' )
# Exceptions to FORBIDDEN.
ALLOWED=( '.env.example' '*/.env.example' )

# Commits touching these need HUMAN_APPROVED=1 (see AGENTS.md conventions).
PROTECTED=( 'AGENTS.md' 'agent-kit.conf' 'Makefile' '_docs/specs.md' '_docs/project-brief.md' '_docs/agent-kit/*' 'opencode.json' '.opencode/*' 'CLAUDE.md' '.claude/*' )
